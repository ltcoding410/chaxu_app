spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:13306/chaxu?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:chaxu_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
mybatis:
  configuration:
    map-underscore-to-camel-case: true
